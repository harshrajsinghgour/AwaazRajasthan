<!doctype html>
<html lang="hi-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="robots" content="noindex" />
  <title>पेज नहीं मिला | आवाज़ राजस्थान</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f5f7;color:#07111f;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.card{width:min(560px,100%);padding:34px 24px;text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:22px;box-shadow:0 18px 50px rgba(7,17,31,.1)}.mark{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#07111f;color:#fff;border:4px solid #d71920;font-size:32px;font-weight:900}.eyebrow{margin:0 0 8px;color:#d71920;font-size:13px;font-weight:800;letter-spacing:.08em}.card h1{margin:0 0 10px;font-size:30px}.card p{margin:0 auto 24px;max-width:430px;color:#5b6472;line-height:1.65}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:12px;background:#d71920;color:#fff;text-decoration:none;font-weight:800}.btn:focus-visible{outline:3px solid #07111f;outline-offset:3px}@media(max-width:480px){.card{padding:28px 18px}.card h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="mark" aria-hidden="true">आ</div>
    <p class="eyebrow">404 • PAGE NOT FOUND</p>
    <h1>यह पेज नहीं मिला</h1>
    <p>जिस खबर या पेज को आप ढूंढ रहे हैं वह उपलब्ध नहीं है, हटाया जा चुका है या उसका पता बदल गया है।</p>
    <a class="btn" href="/">होम पेज पर जाएँ</a>
  </main>
</body>
</html>

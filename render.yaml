services:
  - type: web
    name: awaaz-rajasthan-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm audit fix --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_API_URL
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: awaaz-rajasthan-push-worker
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm audit fix --omit=dev
    startCommand: npm run push-worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_WORKER_POLL_MS
        value: "30000"
      - key: PUSH_WORKER_CONCURRENCY
        value: "10"
      - key: PUSH_WORKER_CLAIM_TIMEOUT_MS
        value: "600000"

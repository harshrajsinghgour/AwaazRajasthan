services:
  - type: web
    name: awaaz-rajasthan-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_API_URL
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          name: AwaazRajasthan-Redis
          type: keyvalue
          property: connectionString
      - key: MEILI_URL
        sync: false
      - key: MEILI_MASTER_KEY
        sync: false
      - key: MEILI_INDEX
        value: awaaz_news

  - type: worker
    name: awaaz-rajasthan-push-worker
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run push-worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_WORKER_POLL_MS
        value: "30000"
      - key: PUSH_WORKER_CONCURRENCY
        value: "10"
      - key: PUSH_WORKER_CLAIM_TIMEOUT_MS
        value: "600000"
      - key: REDIS_URL
        fromService:
          name: AwaazRajasthan-Redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: AwaazRajasthan-Redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

